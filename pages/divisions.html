<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaktika - Divisions</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="/assets/img/Goodstuff-No-Nonsense-Free-Space-Galaxy.ico">
    <style>
        #divisions-container {
            width: 100%;
            max-width: 800px;
        }
    </style>
</head>
<body>
<div id="game-container">
    <div id="user-menu"></div>
    <h1>Divisions</h1>
    <p id="error-msg" style="display:none"></p>
    <div id="divisions-container">
       <!-- generated with JS -->
    </div>
</div>
<script type="module">
    import {ClearE, GetE} from "../assets/js/helper.js";
    import {App} from "../assets/js/app.js";
    const app = new App()

    app.renderMenu()

    const divisionsView = app.getDivisionsView()
    const view = await divisionsView.generateView()
    ClearE(GetE("divisions-container")).appendChild(view)

</script>
</body>
</html>

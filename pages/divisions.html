<!DOCTYPE html>
<html lang="en">
<head>
    <!--
    TODO separate css in to files
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaktika - Divisions</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="/assets/img/Goodstuff-No-Nonsense-Free-Space-Galaxy.ico">
    <style>
        #divisions-container {
            width: 100%;
            max-width: 800px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1a1a1a;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        th {
            background-color: #222;
            color: #4a9eff;
            font-weight: bold;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #222;
        }

        #error-msg {
            color: #ff4a4a;
        }

        a {
            color: #4a9eff;
        }
    </style>
</head>
<body>
<div id="game-container">
    <h1>Divisions</h1>
    <p id="error-msg" style="display:none"></p>
    <div id="divisions-container">
       <!-- generated with JS -->
    </div>
    <p><a href="/">Back</a></p>
</div>
<script type="module">
    import '/assets/js/user-bar.js';

    import DivisionsView from "../assets/js/divisions_view.js";
    import {ClearE, GetE} from "../assets/js/helper.js";
    import {ApiClient} from "../assets/js/api.js";

    // TODO use dependency injection later
    const apiClient = new ApiClient();
    const divisionsView = new DivisionsView(apiClient)

    const view = await divisionsView.generateView()

    // console.log('divisions.html[81] view', view)
    ClearE(GetE("divisions-container")).appendChild(view)
</script>
</body>
</html>

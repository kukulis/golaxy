<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaktika - Fleet Builds</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="/assets/img/Goodstuff-No-Nonsense-Free-Space-Galaxy.ico">
    <style>
        #fleet-builds-container { width: 100%; max-width: 600px; }
    </style>
</head>
<body>
<div id="game-container">
    <div id="user-menu"></div>

    <h1 id="page-title"></h1>
    <p id="error-msg" style="display:none"></p>
    <div id="fleet-builds-container">
        <!-- generated with JS -->
    </div>
</div>
<script type="module">
    // import '/assets/js/user-bar.js';
    import {ClearE, GetE} from '/assets/js/helper.js';
    import {App} from '/assets/js/app.js';

    const divisionId = location.pathname.split('/')[2];

    // TODO remake
    document.getElementById('page-title').textContent = `Fleet Builds: ${divisionId}`;
    // document.getElementById('back-link').href = `/division/${divisionId}/main.html`;

    const app = new App()

    app.renderMenu()

    const fleetBuildsView = app.getFleetBuildsView()
    fleetBuildsView.setDivisionId(divisionId)
    const view = await fleetBuildsView.generateView()
    ClearE(GetE('fleet-builds-container')).appendChild(view)
</script>
</body>
</html>
